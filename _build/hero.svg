<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- UK small-business desk: laptop, receipts, calendar, mileage badge. Teal palette, no text. -->
  <defs>
    <clipPath id="scr"><rect x="282" y="252" width="236" height="160" rx="6"/></clipPath>
  </defs>
  <!-- backdrop -->
  <circle cx="420" cy="300" r="262" fill="#0d6e6e" opacity=".55"/>
  <circle cx="420" cy="300" r="200" fill="#0f7c7a" opacity=".55"/>
  <!-- sparkles -->
  <g fill="#ffffff" opacity=".85">
    <path d="M700 120l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/>
    <path d="M110 120l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity=".7"/>
    <path d="M560 70l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".6"/>
  </g>
  <!-- dotted route from car badge to pin -->
  <path d="M220 190 C 330 110, 520 110, 640 178" fill="none" stroke="#ffdd00" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
  <!-- map pin -->
  <g transform="translate(640 150)">
    <path d="M0 50 C -26 18, -28 4, -28 -6 A28 28 0 0 1 28 -6 C 28 4, 26 18, 0 50z" fill="#ffdd00"/>
    <circle cx="0" cy="-6" r="11" fill="#084848"/>
  </g>
  <!-- mileage badge with car -->
  <g transform="translate(168 196)">
    <circle r="62" fill="#ffffff"/>
    <circle r="62" fill="none" stroke="#d4eeec" stroke-width="8"/>
    <path d="M-38 10 v-10 q0-8 8-10 l10-3 l12-17 q4-5 11-5 h18 q7 0 11 5 l13 17 q10 2 10 12 v11 q0 4-4 4 h-85 q-4 0-4-4z" fill="#0d6e6e"/>
    <path d="M-12 -14 l9-12 h14 v12z M15 -14 v-12 h7 q3 0 5 2 l7 10z" fill="#d4eeec"/>
    <circle cx="-20" cy="16" r="10" fill="#0f1c1e"/><circle cx="-20" cy="16" r="4" fill="#b8c5c7"/>
    <circle cx="26" cy="16" r="10" fill="#0f1c1e"/><circle cx="26" cy="16" r="4" fill="#b8c5c7"/>
    <rect x="35" y="-4" width="7" height="5" rx="2" fill="#ffdd00"/>
  </g>
  <!-- desk -->
  <rect x="50" y="446" width="700" height="24" rx="12" fill="#d4eeec"/>
  <rect x="80" y="468" width="640" height="14" rx="7" fill="#9fcfca"/>
  <!-- receipts -->
  <g transform="rotate(5 150 380)">
    <path d="M96 300 h104 v138 l-9 -7 -9 7 -9 -7 -9 7 -9 -7 -9 7 -9 -7 -9 7 -9 -7 -9 7 -6 -5z" fill="#eef4f4"/>
  </g>
  <g transform="rotate(-7 150 380)">
    <path d="M100 306 h104 v134 l-9 -7 -9 7 -9 -7 -9 7 -9 -7 -9 7 -9 -7 -9 7 -9 -7 -9 7 -6 -5z" fill="#ffffff"/>
    <rect x="116" y="324" width="50" height="7" rx="3.5" fill="#0d6e6e"/>
    <g fill="#b8c5c7"><rect x="116" y="344" width="72" height="5" rx="2.5"/><rect x="116" y="358" width="60" height="5" rx="2.5"/><rect x="116" y="372" width="68" height="5" rx="2.5"/><rect x="116" y="386" width="52" height="5" rx="2.5"/></g>
    <rect x="116" y="404" width="72" height="3" fill="#d4eeec"/>
    <rect x="150" y="412" width="38" height="8" rx="4" fill="#0d6e6e"/>
