    <path d="M612 300 a12 12 0 0 1 12 -12 h100 a12 12 0 0 1 12 12 v20 h-124z" fill="#0d6e6e"/>
    <rect x="638" y="278" width="8" height="22" rx="4" fill="#084848"/><rect x="702" y="278" width="8" height="22" rx="4" fill="#084848"/>
    <g fill="#d4eeec">
