      <rect x="432" y="300" width="70" height="7" rx="3.5" fill="#b8c5c7"/>
      <circle cx="418" cy="332" r="8" fill="#0d6e6e"/><path d="M414 332l3 3 6-6" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="432" y="328" width="58" height="7" rx="3.5" fill="#b8c5c7"/>
      <circle cx="418" cy="360" r="8" fill="#0d6e6e"/><path d="M414 360l3 3 6-6" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="432" y="356" width="66" height="7" rx="3.5" fill="#b8c5c7"/>
      <circle cx="418" cy="388" r="8" fill="none" stroke="#b8c5c7" stroke-width="2.5"/>
      <rect x="432" y="384" width="50" height="7" rx="3.5" fill="#d4eeec"/>
