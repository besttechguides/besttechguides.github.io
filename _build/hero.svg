      <rect x="626" y="356" width="18" height="16" rx="3"/><rect x="650" y="356" width="18" height="16" rx="3"/><rect x="698" y="356" width="18" height="16" rx="3"/>
      <rect x="626" y="380" width="18" height="16" rx="3"/><rect x="650" y="380" width="18" height="16" rx="3"/><rect x="674" y="380" width="18" height="16" rx="3"/><rect x="698" y="380" width="18" height="16" rx="3"/>
